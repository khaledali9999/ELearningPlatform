<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="760" height="640" fill="#ffffff"/>
  <text x="380" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">E-Learning Mini Platform - Architecture</text>

  <!-- MVC -->
  <rect x="230" y="60" width="300" height="56" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="380" y="85" text-anchor="middle" font-size="16" font-weight="700" fill="#0c4a6e">MVC (Views + ViewModels)</text>
  <text x="380" y="104" text-anchor="middle" font-size="12" fill="#075985">Razor views, validation attributes</text>
  <line x1="380" y1="116" x2="380" y2="146" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Controllers -->
  <rect x="230" y="148" width="300" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="380" y="173" text-anchor="middle" font-size="16" font-weight="700" fill="#14532d">Controllers (thin)</text>
  <text x="380" y="193" text-anchor="middle" font-size="12" fill="#166534">Students / Courses / Enrollments / Reviews</text>
  <text x="380" y="209" text-anchor="middle" font-size="12" fill="#166534">no business logic, no DbContext</text>
  <line x1="380" y1="218" x2="380" y2="248" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Services -->
  <rect x="230" y="250" width="300" height="84" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="380" y="275" text-anchor="middle" font-size="16" font-weight="700" fill="#713f12">Services (I*Service)</text>
  <text x="380" y="295" text-anchor="middle" font-size="12" fill="#854d0e">ALL business rules live here</text>
  <text x="380" y="311" text-anchor="middle" font-size="12" fill="#854d0e">duplicate enroll, course full, review rules</text>
  <text x="380" y="327" text-anchor="middle" font-size="12" fill="#854d0e">throws custom exceptions + logging</text>
  <line x1="380" y1="334" x2="380" y2="364" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Repositories -->
  <rect x="230" y="366" width="300" height="70" rx="10" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="380" y="391" text-anchor="middle" font-size="16" font-weight="700" fill="#831843">Repositories (I*Repository)</text>
  <text x="380" y="411" text-anchor="middle" font-size="12" fill="#9d174d">only data access (EF Core queries)</text>
  <text x="380" y="427" text-anchor="middle" font-size="12" fill="#9d174d">GenericRepository + specific queries</text>
  <line x1="380" y1="436" x2="380" y2="466" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- DbContext -->
  <rect x="230" y="468" width="300" height="56" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="380" y="493" text-anchor="middle" font-size="16" font-weight="700" fill="#4c1d95">AppDbContext (EF Core)</text>
  <text x="380" y="512" text-anchor="middle" font-size="12" fill="#5b21b6">entities, relations, unique indexes</text>
  <line x1="380" y1="524" x2="380" y2="554" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- SQL Server -->
  <rect x="230" y="556" width="300" height="50" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="380" y="587" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">SQL Server</text>

  <!-- Side: cross-cutting -->
  <rect x="580" y="150" width="160" height="150" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="660" y="176" text-anchor="middle" font-size="14" font-weight="700" fill="#7c2d12">Cross-cutting</text>
  <text x="660" y="200" text-anchor="middle" font-size="12" fill="#9a3412">Dependency Injection</text>
  <text x="660" y="220" text-anchor="middle" font-size="12" fill="#9a3412">Global Exception</text>
  <text x="660" y="236" text-anchor="middle" font-size="12" fill="#9a3412">Handler middleware</text>
  <text x="660" y="256" text-anchor="middle" font-size="12" fill="#9a3412">Logging (ILogger)</text>
  <text x="660" y="276" text-anchor="middle" font-size="12" fill="#9a3412">Custom Exceptions</text>

  <!-- Side: models -->
  <rect x="20" y="150" width="170" height="150" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="105" y="176" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Entities</text>
  <text x="105" y="200" text-anchor="middle" font-size="12" fill="#334155">Student, Instructor</text>
  <text x="105" y="220" text-anchor="middle" font-size="12" fill="#334155">Course, Lesson</text>
  <text x="105" y="240" text-anchor="middle" font-size="12" fill="#334155">Enrollment, Review</text>
  <text x="105" y="270" text-anchor="middle" font-size="11" fill="#64748b">shared by all layers</text>
</svg>
